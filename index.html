<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Acme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <main class="login-panel">
      <div class="login-panel__inner">
        <header class="login-header">
          <a href="/" class="brand-mark" aria-label="Acme home">
            <span class="brand-mark__orbit" aria-hidden="true">
              <span class="brand-mark__orb"></span>
              <span class="brand-mark__orb brand-mark__orb--secondary"></span>
            </span>
            <svg class="brand-mark__icon" viewBox="0 0 40 40" aria-hidden="true">
              <circle cx="20" cy="20" r="20" fill="currentColor"/>
              <text x="20" y="27" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700">A</text>
            </svg>
          </a>
          <h1 class="login-header__title">Welcome back!</h1>
          <p class="login-header__subtitle">
            Don't have an account yet?
            <a href="#" class="link">Sign up now</a>
          </p>
        </header>

        <form class="login-form" id="login-form" novalidate>
          <div class="field">
            <label class="field__label visually-hidden" for="email">Email address</label>
            <input
              class="field__input"
              type="email"
              id="email"
              name="email"
              placeholder="Email address"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label class="field__label visually-hidden" for="password">Password</label>
            <div class="field__password-wrap">
              <input
                class="field__input field__input--password"
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
              >
              <button
                type="button"
                class="field__toggle"
                id="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <svg class="icon-eye icon-eye--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5C5.5 5 1.73 10.11 1 12c.73 1.89 4.5 7 11 7s10.27-5.11 11-7c-.73-1.89-4.5-7-11-7zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="currentColor"/>
                </svg>
                <svg class="icon-eye icon-eye--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.27 3.27 2 4.54l2.89 2.89C3.53 8.47 2.39 10.17 1 12c.73 1.89 4.5 7 11 7 1.78 0 3.37-.42 4.74-1.08l3.21 3.21 1.27-1.27L3.27 3.27zM12 17.5c-4.27 0-7.54-3.4-8.87-5.5.73-1.12 2.13-2.92 4.12-4.08l1.93 1.93A2.5 2.5 0 0 0 12 14.5c.34 0 .67-.07.97-.19l1.74 1.74c-.86.3-1.78.45-2.71.45zm8.73-5.5c-.46-.71-1.18-1.68-2.09-2.59l-1.42 1.42a4.48 4.48 0 0 1 .54 1.17C16.53 13.53 14.61 15.5 12 15.5a4.46 4.46 0 0 1-1.17-.16l-1.5 1.5C10.2 17.18 11.07 17.5 12 17.5c6.5 0 10.27-5.11 11-7-.28-.73-.73-1.52-1.27-2.5z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-form__options">
            <label class="checkbox">
              <input class="checkbox__input" type="checkbox" name="remember" id="remember">
              <span class="checkbox__box" aria-hidden="true"></span>
              <span class="checkbox__label">Remember me</span>
            </label>
            <a href="#" class="link link--small">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary">Log in</button>

          <div class="divider" role="separator" aria-label="Or">
            <span class="divider__text">OR</span>
          </div>

          <a href="#" class="link link--sso">Log in with SSO</a>
        </form>
      </div>
    </main>

    <aside class="pattern-panel" aria-hidden="true">
      <div class="pattern-panel__grid"></div>
    </aside>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="/" class="site-footer__brand">
        <svg class="site-footer__mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" fill="currentColor"/>
          <text x="12" y="16.5" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">A</text>
        </svg>
        <span>Acme</span>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
